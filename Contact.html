<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact MediFriend</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="bg-slideshow">
    <div class="bg-slide"></div>
    <div class="bg-slide"></div>
    <div class="bg-slide"></div>
    <div class="bg-slide"></div>
    <div class="bg-slide"></div>
  </div>
  <div class="page-content">
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <span class="brand-name">MediFriend</span>
      </a>

      <nav class="primary-nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="index2.html">Diagnosis</a>
        <a href="About.html">About</a>
        <a href="Contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h1>Contact Us</h1>
      <p class="lead">Have a question or feedback about MediFriend? Send us a message and we'll get back to you as soon as possible.</p>

      <form class="contact-form" id="contactForm" novalidate>
        <div class="field-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name">
        </div>

        <div class="field-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">
        </div>

        <div class="field-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Write us a message..."></textarea>
        </div>

        <button type="submit" class="primary-button">Send Message</button>
        <p id="contactFeedback" class="field-error" aria-live="polite"></p>
      </form>
      <div class="contact-info">
        <h2>Get in Touch</h2>
        <p><strong>Location:</strong> Uganda, Kampala</p>
        <p><strong>Email:</strong> info@medifriend.com</p>
        <p><strong>Phone:</strong> 077733355</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> MediFriend. Built for educational purposes.</p>
    </div>
  </footer>

  <script src="Script.js"></script>
  </div>
</body>

</html>
